<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pekofull 給餌量計算ツール</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    :root {
      --brand-blue: #3b82c4;
      --brand-blue-hover: #2d6aa2;
      --brand-light-bg: #edf5fa;
      --board-navy: #1b2845;
      --gold-accent: #dfb36c;
      --meal-accent: #e67e22;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--brand-light-bg);
      padding: 10px;
      margin: 0;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(59, 130, 196, 0.12);
      max-width: 400px;
      margin: auto;
    }

    h2 {
      color: var(--brand-blue);
      text-align: center;
      margin: 0 0 10px 0;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 10px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      color: #444;
      font-size: 13px;
    }

    input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      font-size: 15px;
      border: 1.5px solid #d0e1f0;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      background: #fff;
    }

    .btn-calc {
      width: 100%;
      background: var(--brand-blue);
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 5px;
      font-weight: bold;
    }

    /* 計算後のコンパクト条件サマリー */
    .conditions-summary {
      display: none;
      background: #f0f4f8;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      color: #555;
      margin-bottom: 10px;
      justify-content: space-between;
      align-items: center;
    }

    .btn-recalc {
      background: none;
      border: 1px solid var(--brand-blue);
      color: var(--brand-blue);
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
    }

    .result {
      display: none;
    }

    /* 数字結果のグリッド（コンパクト化） */
    .res-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--brand-light-bg);
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .res-box {
      text-align: center;
      background: #fff;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid #e0ebf5;
    }

    .res-box.highlight-box {
      border: 1.5px solid var(--meal-accent);
      background: #fffaf5;
    }

    .res-box .val {
      font-size: 16px;
      font-weight: bold;
      color: var(--brand-blue);
    }

    .res-box.highlight-box .val {
      color: var(--meal-accent);
    }

    .res-box .unit {
      font-size: 10px;
      color: #666;
    }

    /* カッティングボード（コンパクト化） */
    .cutting-board {
      background: var(--board-navy);
      border-radius: 10px;
      padding: 10px 10px;
      color: var(--gold-accent);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }

    .board-title {
      font-size: 10px;
      text-align: center;
      margin-bottom: 6px;
      color: #fff;
      font-weight: bold;
    }

    .ruler {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #fff;
      padding: 0 2px;
    }

    .roll-container {
      position: relative;
      background: #4a2c22;
      height: 32px;
      border-radius: 16px;
      margin: 6px 0;
      border: 1.5px solid var(--gold-accent);
      overflow: hidden;
      display: flex;
    }

    .roll-meal-portion {
      background: var(--meal-accent);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      transition: width 0.3s ease;
      border-right: 1.5px dashed #fff;
    }

    .roll-day-portion {
      background: var(--brand-blue);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      transition: width 0.3s ease;
      border-right: 1.5px solid #fff;
    }

    .cut-guide {
      margin-top: 8px;
      font-size: 11px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      border-radius: 4px;
      line-height: 1.4;
    }

    .cut-guide b {
      color: var(--gold-accent);
      font-size: 12px;
    }

    .meal-highlight {
      color: #ffbe76 !important;
    }

    .btn-send {
      width: 100%;
      background: #06C755;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>「ぺこふる」給餌量計算</h2>

    <!-- 1. 入力フォームエリア（計算後に非表示） -->
    <div id="inputSection">
      <div class="form-group">
        <label for="weight">体重 (kg)</label>
        <input type="number" id="weight" step="0.1" min="0.1" max="60" placeholder="例: 5.5">
      </div>

      <div class="form-group">
        <label for="times">1日の給餌回数</label>
        <select id="times">
          <option value="2" selected>2回（朝・夕）</option>
          <option value="1">1回</option>
          <option value="3">3回（朝・昼・晩）</option>
        </select>
      </div>

      <button class="btn-calc" onclick="calculate()">計算する</button>
    </div>

    <!-- 2. 計算後のコンパクト条件表示サマリー -->
    <div id="conditionsSummary" class="conditions-summary">
      <div>
        体重: <b><span id="sumWeight">0</span> kg</b>｜回数: <b>1日<span id="sumTimes">2</span>回</b>
      </div>
      <button class="btn-recalc" onclick="resetForm()">変更</button>
    </div>

    <!-- 3. 結果表示エリア -->
    <div id="result" class="result">
      
      <div class="res-summary">
        <div class="res-box highlight-box">
          <div class="unit">1食の給与量</div>
          <div class="val"><span id="mealGram">0</span><span style="font-size:10px;">g</span></div>
        </div>
        <div class="res-box">
          <div class="unit">1日の給与量</div>
          <div class="val"><span id="dayGram">0</span><span style="font-size:10px;">g</span></div>
        </div>
        <div class="res-box">
          <div class="unit">1日のカロリー</div>
          <div class="val"><span id="kcal">0</span><span style="font-size:10px;">kcal</span></div>
        </div>
        <div class="res-box">
          <div class="unit">1本(400g)持ち</div>
          <div class="val">約<span id="days">0</span><span style="font-size:10px;">日分</span></div>
        </div>
      </div>

      <!-- カッティングボード表示 -->
      <div class="cutting-board">
        <div class="board-title">THE DOG ROLL FOOD - CUTTING BOARD</div>
        
        <div class="ruler">
          <span>0g</span>
          <span>100g</span>
          <span>200g</span>
          <span>300g</span>
          <span>400g</span>
        </div>

        <div class="roll-container">
          <div id="rollMealPortion" class="roll-meal-portion" style="width: 0%;">1食</div>
          <div id="rollDayPortion" class="roll-day-portion" style="width: 0%;">1日残り</div>
        </div>

        <div class="cut-guide">
          🔸 <b>1食分:</b> 端から約 <b class="meal-highlight"><span id="mealCm">0</span> cm</b>（約 <span id="mealGramGuide">0</span>g）<br>
          🔹 <b>1日分:</b> 端から約 <b><span id="dayCm">0</span> cm</b>（約 <span id="dayGramGuide">0</span>g）
        </div>
      </div>

      <button id="sendBtn" class="btn-send" onclick="sendToLineTalk()">
        LINEトークに結果を送信
      </button>

    </div>
  </div>

  <script>
    // ※ 取得したLIFF IDをここにセット
    const MY_LIFF_ID = "2011227642-LDuApiZX";

    document.addEventListener("DOMContentLoaded", function () {
      liff.init({ liffId: MY_LIFF_ID }).catch(err => console.error(err));
    });

    let currentWeight = 0;
    let currentTimes = 2;
    let calculatedDayGram = 0;
    let calculatedMealGram = 0;
    let calculatedDays = 0;
    let calculatedDayCm = 0;
    let calculatedMealCm = 0;

    function calculate() {
      const weight = parseFloat(document.getElementById('weight').value);
      const times = parseInt(document.getElementById('times').value);

      if (!weight || weight <= 0 || weight > 60) {
        alert('0.1kg 〜 60kg の範囲で入力してください。');
        return;
      }

      currentWeight = weight;
      currentTimes = times;

      const kcal = 130 * Math.pow(weight, 0.75);
      calculatedDayGram = Math.round(kcal / 1.946); 
      calculatedMealGram = Math.round(calculatedDayGram / times);
      calculatedDays = (400 / calculatedDayGram).toFixed(1);

      calculatedDayCm = (28 * (calculatedDayGram / 400)).toFixed(1);
      calculatedMealCm = (28 * (calculatedMealGram / 400)).toFixed(1);

      // サマリー表示のセット
      document.getElementById('sumWeight').innerText = currentWeight;
      document.getElementById('sumTimes').innerText = currentTimes;

      // 各項目のセット
      document.getElementById('mealGram').innerText = calculatedMealGram;
      document.getElementById('dayGram').innerText = calculatedDayGram;
      document.getElementById('kcal').innerText = Math.round(kcal);
      document.getElementById('days').innerText = calculatedDays;

      document.getElementById('mealCm').innerText = calculatedMealCm;
      document.getElementById('mealGramGuide').innerText = calculatedMealGram;
      document.getElementById('dayCm').innerText = calculatedDayCm;
      document.getElementById('dayGramGuide').innerText = calculatedDayGram;

      let dayPercent = (calculatedDayGram / 400) * 100;
      let mealPercent = (calculatedMealGram / 400) * 100;
      
      if (dayPercent > 100) dayPercent = 100;
      if (mealPercent > dayPercent) mealPercent = dayPercent;

      const restDayPercent = dayPercent - mealPercent;

      document.getElementById('rollMealPortion').style.width = mealPercent.toFixed(1) + '%';
      document.getElementById('rollDayPortion').style.width = restDayPercent.toFixed(1) + '%';

      // 画面切り替え（入力欄を消して結果を表示）
      document.getElementById('inputSection').style.display = 'none';
      document.getElementById('conditionsSummary').style.display = 'flex';
      document.getElementById('result').style.display = 'block';
    }

    // 条件を変更する時の再表示処理
    function resetForm() {
      document.getElementById('inputSection').style.display = 'block';
      document.getElementById('conditionsSummary').style.display = 'none';
      document.getElementById('result').style.display = 'none';
    }

    function sendToLineTalk() {
      if (!liff.isLoggedIn()) {
        alert("LINEでログインされていません。");
        return;
      }

      const messageText = `🐶【ぺこふる】給餌量カット計算結果\n` +
        `--------------------\n` +
        `■ 体重: ${currentWeight} kg / 1日 ${currentTimes} 回\n` +
        `🍚 1食分: 約 ${calculatedMealGram} g (約 ${calculatedMealCm} cm)\n` +
        `🍖 1日分: 約 ${calculatedDayGram} g (約 ${calculatedDayCm} cm)\n` +
        `📦 1本持ち: 約 ${calculatedDays} 日分`;

      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: messageText }])
          .then(() => {
            alert('トークに結果を送信しました！');
            liff.closeWindow();
          })
          .catch((err) => alert('送信失敗: ' + err.message));
      }
    }
  </script>

</body>

</html>

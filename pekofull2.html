<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --brand-blue: #3b82c4;
      --brand-blue-hover: #2d6aa2;
      --brand-light-bg: #edf5fa;
      --board-navy: #1b2845;
      --gold-accent: #dfb36c;
      --meal-accent: #e67e22;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--brand-light-bg);
      padding: 10px;
      margin: 0;
      color: #333;
    }

    .card {
      background: #fff;
      padding: 12px 15px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(59, 130, 196, 0.12);
      max-width: 400px;
      margin: auto;
    }

    /* 上部タブ切り替え */
    .tab-container {
      display: flex;
      border-bottom: 2px solid #d0e1f0;
      margin-bottom: 12px;
    }

    .tab-button {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      font-weight: bold;
      font-size: 13px;
      color: #666;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }

    .tab-button.active {
      color: var(--brand-blue);
      border-bottom-color: var(--brand-blue);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 共通フォーム */
    .form-group {
      margin-bottom: 8px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
      color: #444;
      font-size: 12px;
    }

    input[type="number"], select {
      width: 100%;
      padding: 8px 10px;
      font-size: 14px;
      border: 1.5px solid #d0e1f0;
      border-radius: 6px;
      box-sizing: border-box;
      outline: none;
      background: #fff;
    }

    .btn-main {
      width: 100%;
      background: var(--brand-blue);
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 6px;
      font-weight: bold;
    }

    /* --- 給餌量計算スタイル --- */
    .conditions-summary {
      display: none;
      background: #f0f4f8;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 11px;
      color: #555;
      margin-bottom: 8px;
      justify-content: space-between;
      align-items: center;
    }

    .btn-recalc {
      background: none;
      border: 1px solid var(--brand-blue);
      color: var(--brand-blue);
      padding: 2px 6px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .res-summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--brand-light-bg);
      padding: 6px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .res-box {
      text-align: center;
      background: #fff;
      padding: 6px 4px;
      border-radius: 6px;
      border: 1px solid #e0ebf5;
    }

    .res-box.highlight-box {
      border: 1.5px solid var(--meal-accent);
      background: #fffaf5;
    }

    .res-box .val {
      font-size: 16px;
      font-weight: bold;
      color: var(--brand-blue);
    }

    .res-box.highlight-box .val {
      color: var(--meal-accent);
    }

    .res-box .unit {
      font-size: 10px;
      color: #666;
    }

    .cutting-board {
      background: var(--board-navy);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--gold-accent);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.4);
    }

    .board-title {
      font-size: 9px;
      text-align: center;
      margin-bottom: 4px;
      color: #fff;
      font-weight: bold;
    }

    .ruler {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      color: #fff;
    }

    .roll-container {
      position: relative;
      background: #4a2c22;
      height: 28px;
      border-radius: 14px;
      margin: 4px 0;
      border: 1.5px solid var(--gold-accent);
      overflow: hidden;
      display: flex;
    }

    .roll-meal-portion {
      background: var(--meal-accent);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      transition: width 0.3s ease;
      border-right: 1.5px dashed #fff;
    }

    .roll-day-portion {
      background: var(--brand-blue);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      transition: width 0.3s ease;
      border-right: 1.5px solid #fff;
    }

    .cut-guide {
      margin-top: 6px;
      font-size: 11px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 8px;
      border-radius: 4px;
      line-height: 1.4;
    }

    .cut-guide b {
      color: var(--gold-accent);
    }

    .meal-highlight {
      color: #ffbe76 !important;
    }

    .btn-send {
      width: 100%;
      background: #06C755;
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }

    /* --- 店舗検索スタイル --- */
    .store-list {
      margin-top: 10px;
    }

    .store-card {
      background: #f8fafc;
      border: 1px solid #d0e1f0;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .store-name {
      font-weight: bold;
      font-size: 13px;
      color: var(--board-navy);
      margin-bottom: 4px;
    }

    .map-btn {
      display: inline-block;
      background: #4285F4;
      color: #fff;
      text-decoration: none;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>

  <script>
    const MY_LIFF_ID = "2011227642-LDuApiZX";

    let lineUserId = "";
    let currentWeight = 0;
    let currentTimes = 2;
    let calculatedDayGram = 0;
    let calculatedMealGram = 0;
    let calculatedDays = 0;
    let calculatedDayCm = 0;
    let calculatedMealCm = 0;

    document.addEventListener("DOMContentLoaded", function () {
      liff.init({ liffId: MY_LIFF_ID }).then(() => {
        if (liff.isLoggedIn()) {
          liff.getProfile().then(profile => {
            lineUserId = profile.userId;
          });
        }
      }).catch(err => console.error(err));
    });

    // タブ切り替え
    function switchTab(tabName) {
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'calc') {
        document.querySelectorAll('.tab-button')[0].classList.add('active');
        document.getElementById('calcTab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-button')[1].classList.add('active');
        document.getElementById('storeTab').classList.add('active');
      }
    }

    // 計算ロジック
    function calculate() {
      const weight = parseFloat(document.getElementById('weight').value);
      const times = parseInt(document.getElementById('times').value);

      if (!weight || weight <= 0 || weight > 60) {
        alert('0.1kg 〜 60kg の範囲で入力してください。');
        return;
      }

      currentWeight = weight;
      currentTimes = times;

      const kcal = 130 * Math.pow(weight, 0.75);
      calculatedDayGram = Math.round(kcal / 1.946); 
      calculatedMealGram = Math.round(calculatedDayGram / times);
      calculatedDays = (400 / calculatedDayGram).toFixed(1);

      calculatedDayCm = (28 * (calculatedDayGram / 400)).toFixed(1);
      calculatedMealCm = (28 * (calculatedMealGram / 400)).toFixed(1);

      // サマリー表示のセット
      document.getElementById('sumWeight').innerText = currentWeight;
      document.getElementById('sumTimes').innerText = currentTimes;

      // 各項目のセット
      document.getElementById('mealGram').innerText = calculatedMealGram;
      document.getElementById('dayGram').innerText = calculatedDayGram;
      document.getElementById('kcal').innerText = Math.round(kcal);
      document.getElementById('days').innerText = calculatedDays;

      document.getElementById('mealCm').innerText = calculatedMealCm;
      document.getElementById('mealGramGuide').innerText = calculatedMealGram;
      document.getElementById('dayCm').innerText = calculatedDayCm;
      document.getElementById('dayGramGuide').innerText = calculatedDayGram;

      let dayPercent = (calculatedDayGram / 400) * 100;
      let mealPercent = (calculatedMealGram / 400) * 100;
      
      if (dayPercent > 100) dayPercent = 100;
      if (mealPercent > dayPercent) mealPercent = dayPercent;

      const restDayPercent = dayPercent - mealPercent;

      document.getElementById('rollMealPortion').style.width = mealPercent.toFixed(1) + '%';
      document.getElementById('rollDayPortion').style.width = restDayPercent.toFixed(1) + '%';

      // 画面切り替え
      document.getElementById('inputSection').style.display = 'none';
      document.getElementById('conditionsSummary').style.display = 'flex';
      document.getElementById('result').style.display = 'block';
    }

    function resetForm() {
      document.getElementById('inputSection').style.display = 'block';
      document.getElementById('conditionsSummary').style.display = 'none';
      document.getElementById('result').style.display = 'none';
    }

    // LINEトークに送信
    function sendToLineTalk() {
      if (!liff.isLoggedIn()) {
        alert("LINEでログインされていません。");
        return;
      }

      const messageText = `🐶【ぺこふる】給餌量カット計算結果\n` +
        `--------------------\n` +
        `■ 体重: ${currentWeight} kg / 1日 ${currentTimes} 回\n` +
        `🍚 1食分: 約 ${calculatedMealGram} g (約 ${calculatedMealCm} cm)\n` +
        `🍖 1日分: 約 ${calculatedDayGram} g (約 ${calculatedDayCm} cm)\n` +
        `📦 1本持ち: 約 ${calculatedDays} 日分`;

      if (liff.isInClient()) {
        liff.sendMessages([{ type: 'text', text: messageText }])
          .then(() => {
            alert('トークに結果を送信しました！');
            liff.closeWindow();
          })
          .catch((err) => alert('送信失敗: ' + err.message));
      }
    }

    const ONLINE_SHOP_URL = "https://www.pekofull.com";

    function searchStore() {
      const selectedPref = document.getElementById('prefSelect').value;
      if (!selectedPref) return alert('都道府県を選択してください。');

      if (lineUserId) {
        fetch(BACKEND_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: lineUserId, prefecture: selectedPref })
        }).catch(err => console.error("Tag save error:", err));
      }

      const resultDiv = document.getElementById('storeResult');
      resultDiv.innerHTML = "";
      const stores = storeData[selectedPref];

      let mapListHtml = `
        <div style="background:#eef6ff; border:1px solid #b3d4fc; border-radius:8px; padding:10px; margin-bottom:10px; text-align:center;">
          <div style="font-size:12px; font-weight:bold; color:var(--brand-blue); margin-bottom:4px;">📍 全国の取扱店舗マップ（Googleマップ）</div>
          <div style="font-size:10px; color:#666; margin-bottom:6px;">現在地から最も近い店舗をGoogleマップで確認できます</div>
          <a href="${GOOGLE_MAP_LIST_URL}" target="_blank" class="map-btn" style="background:#34A853; display:block; width:100%; box-sizing:border-box;">マップで近くの店舗を探す</a>
        </div>
      `;

      if (stores && stores.length > 0) {
        let storeCardsHtml = "";

        stores.forEach(store => {
          const mapSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.name + " " + store.address)}`;
          const telBtnHtml = store.tel 
            ? `<a href="tel:${store.tel.replace(/-/g, '')}" class="map-btn" style="background:#e67e22;">📞 在庫確認の電話をかける</a>` 
            : '';

          storeCardsHtml += `
            <div class="store-card">
              <div class="store-name">📍 ${store.name}</div>
              <div style="font-size:11px; color:#666; margin-bottom:2px;">${store.address}</div>
              ${store.tel ? `<div style="font-size:11px; color:#666; margin-bottom:6px;">TEL: ${store.tel}</div>` : ''}
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
                <a href="${mapSearchUrl}" target="_blank" class="map-btn">🗺️ ルート案内</a>
                ${telBtnHtml}
              </div>
            </div>
          `;
        });

        const shopFooterHtml = `
          <div style="margin-top:12px; padding:10px; background:#fffaf5; border:1px solid #f3d19c; border-radius:8px; text-align:center;">
            <div style="font-size:11px; color:#555; margin-bottom:6px;">🛒 商品が品切れの場合や遠方の場合は、公式オンラインショップもご利用いただけます。</div>
            <a href="${ONLINE_SHOP_URL}" target="_blank" class="map-btn" style="background:#1b2845; display:block;">公式オンラインショップを見る</a>
          </div>
        `;

        resultDiv.innerHTML = mapListHtml + storeCardsHtml + shopFooterHtml;

      } else {
        resultDiv.innerHTML = mapListHtml + `
          <div style="background:#fff; border:1px solid #d0e1f0; border-radius:8px; padding:15px; text-align:center; margin-top:10px;">
            <div style="font-size:13px; font-weight:bold; color:#444; margin-bottom:6px;">「${selectedPref}」には現在お取り扱い店舗がございません</div>
            <div style="font-size:11px; color:#666; margin-bottom:10px;">公式オンラインショップより全国へお届けしております。ぜひご利用ください。</div>
            <a href="${ONLINE_SHOP_URL}" target="_blank" class="map-btn" style="background:#1b2845; display:block; width:100%; box-sizing:border-box;">🛒 公式オンラインショップで購入する</a>
          </div>
        `;
      }

      resultDiv.style.display = 'block';
    }
  </script>
